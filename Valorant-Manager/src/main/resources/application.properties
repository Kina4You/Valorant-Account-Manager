# Nur ueber die lokale Rueckschleife erreichbar, nie aus dem Netzwerk.
server.address=127.0.0.1

# Port 0 = das Betriebssystem vergibt einen freien Port an unseren Prozess.
# Wichtig gegen Port-Besetzung: bei einem festen Port koennte ein fremdes
# Programm sich diesen vorher schnappen, unser Token abgreifen und der App
# gefaelschte Daten unterschieben. Den tatsaechlichen Port meldet das Backend
# ueber die Standardausgabe an Electron (siehe PortReporter).
server.port=0
